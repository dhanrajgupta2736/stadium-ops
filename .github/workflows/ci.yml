name: Stadium Ops CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Code Quality & Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality Linting
        run: npm run lint

      - name: Run Vitest Automated Test Suite
        run: npm run test

      - name: Production Bundle Compilation
        run: npm run build

      - name: Security Vulnerability Scan
        run: npm audit --audit-level=high --dry-run
